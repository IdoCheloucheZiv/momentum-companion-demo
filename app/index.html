<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Guided Transition Assistant — V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- ============================================================
     GUIDED TRANSITION COMPANION — V2
     Single file. Nothing to install. Open in a browser.

     V1 is untouched. This is a separate file.

     CONFIG: everything you may need to change is in one place,
     in the config block immediately below.

     MOMENTUM REFERENCE LAYER (section 2b in the script): the deeper
     material from the two Momentum files (63 Skills Service Mapping
     Framework + Frontline and Combat-Support Program) lives in this same
     file. The companion looks things up in it ONLY when needed — when the
     person asks for a CV, interview stories, a work direction or a study
     option, or once it knows what kind of service they did. Nothing extra
     is sent during the opening conversation.
     ============================================================ -->

<script id="config">
const CONFIG = {
  // Your Render proxy. Change the path if your proxy uses a different route.
  API_URL: "https://momentum-proxy.onrender.com/api",

  // Model your proxy forwards to.
  MODEL: "claude-sonnet-4-6",

  // Cost control. How many past messages get sent with each request.
  // Lower = cheaper, less memory of earlier turns. 12 is a good balance.
  HISTORY_TURNS: 12,

  // Max tokens per reply. Replies are a short explanation plus one question,
  // and Hebrew uses more tokens per word, so this leaves room for both.
  MAX_TOKENS: 900,

  // Bigger allowance for CV material, interview stories and direction lists,
  // which run longer than a normal reply. Used only on those turns.
  MAX_TOKENS_DOCUMENT: 1600,

  // The Momentum reference material (section 2b) is added to a request only
  // when it is needed. This caps how much can be added (about 4 characters
  // = 1 token). Lower it to spend less; raise it to give the companion more.
  REF_BUDGET_CHARS: 8000,

  // If the proxy cannot be reached, the app falls back to Practice Mode
  // (a built-in scripted engine) so the whole flow stays testable.
  ALLOW_PRACTICE_FALLBACK: true,

  // Human support numbers shown in the "Talk to a person" panel.
  SUPPORT: [
    { name: "ERAN — emotional first aid, 24/7", he: "ער\"ן — עזרה ראשונה נפשית, 24/7", tel: "1201" },
    { name: "NATAL — trauma & resilience, IDF-related", he: "נט\"ל — טראומה וחוסן", tel: "1-800-363-363" },
    { name: "Momentum coordinator", he: "רכז/ת מומנטום", tel: "" }
  ]
};
</script>

<style>
:root{
  --stone:#E7E2D9;        /* page */
  --paper:#FBF9F5;        /* surfaces */
  --paper-2:#F2EEE6;      /* recessed surfaces */
  --ink:#1B1F1A;          /* primary text */
  --ink-2:#4A4F46;        /* secondary text */
  --dust:#8B877C;         /* tertiary text */
  --olive:#4E6146;        /* growth accent */
  --olive-soft:#E2E7DC;
  --clay:#8F5647;         /* weight / cost accent */
  --clay-soft:#F0E2DC;
  --line:#D6D0C4;
  --focus:#2F5D8A;
  --r:14px;
  --w:640px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--stone);color:var(--ink);
  font-family:'Heebo',system-ui,sans-serif;font-size:16px;line-height:1.55;
  display:flex;flex-direction:column;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
.bar{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);
}
.bar .mark{font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:16px;letter-spacing:.01em;margin-inline-end:auto}
.bar .mark span{color:var(--dust);font-family:'Heebo';font-size:12px;font-weight:400;display:block;line-height:1.2}
.chip{
  padding:6px 10px;border:1px solid var(--line);border-radius:999px;
  font-size:13px;color:var(--ink-2);background:var(--paper);transition:.15s;
}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.chip.badge::after{content:attr(data-count);margin-inline-start:6px;background:var(--olive);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}
.chip.badge[data-count="0"]::after{display:none}

/* ---------- generic screen ---------- */
.screen{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
.pad{max-width:var(--w);margin:0 auto;padding:22px 18px 40px}

/* ---------- welcome ---------- */
.hello{font-family:'Frank Ruhl Libre',serif;font-size:29px;line-height:1.28;font-weight:500;margin:10px 0 14px}
.lede{color:var(--ink-2);margin-bottom:22px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.note h3{font-size:14px;font-weight:500;margin-bottom:5px}
.note p{font-size:14px;color:var(--ink-2)}
.note.privacy{background:var(--paper-2)}
.note.privacy p{font-size:13.5px}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
.choice{
  flex:1 1 140px;padding:14px 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--paper);text-align:start;transition:.15s
}
.choice small{display:block;color:var(--dust);font-size:12.5px;margin-top:3px}
.choice.on{border-color:var(--olive);background:var(--olive-soft)}
.go{
  display:block;width:100%;margin-top:18px;padding:15px;border-radius:var(--r);
  background:var(--ink);color:var(--stone);font-size:16px;font-weight:500;transition:.15s
}
.go:hover{background:var(--olive)}
.tiny{font-size:12.5px;color:var(--dust);margin-top:12px;text-align:center}

/* ---------- conversation ---------- */
#thread{display:flex;flex-direction:column;gap:16px}
.turn{max-width:100%}
.turn.them .body{
  font-family:'Frank Ruhl Libre',serif;font-size:18.5px;line-height:1.6;color:var(--ink);
  white-space:pre-wrap;
}
.turn.them .body p+p{margin-top:.7em}
.turn.me{align-self:flex-end;max-width:85%}
.turn.me .body{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r) var(--r) 4px var(--r);
  padding:10px 13px;font-size:15.5px;color:var(--ink-2);white-space:pre-wrap
}
html[dir="rtl"] .turn.me .body{border-radius:var(--r) var(--r) var(--r) 4px}
.turn.sys .body{
  font-size:13.5px;color:var(--dust);border-inline-start:2px solid var(--line);padding-inline-start:10px
}
.thinking{display:flex;gap:5px;padding:6px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--dust);animation:b 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* surfaced skill card inside the thread */
.surface{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.surface h4{font-size:12.5px;font-weight:500;color:var(--dust);margin-bottom:8px}
.surface .row{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:6px 11px;border-radius:999px;background:var(--olive-soft);color:var(--olive);font-size:13.5px;border:1px solid transparent}
.tag.cost{background:var(--clay-soft);color:var(--clay)}
.props{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.prop{
  text-align:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--paper);transition:.15s
}
.prop:hover{border-color:var(--olive)}
.prop b{display:block;font-weight:500;font-size:15px}
.prop small{color:var(--dust);font-size:13px}

/* ---------- composer ---------- */
.composer{
  flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.cwrap{max-width:var(--w);margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#input{
  flex:1;resize:none;border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;font-family:inherit;font-size:16px;line-height:1.45;
  background:var(--paper);color:var(--ink);max-height:140px;min-height:46px
}
#input:focus{outline:none;border-color:var(--olive)}
.icon{
  width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;background:var(--paper);transition:.15s
}
.icon.send{background:var(--ink);color:var(--stone);border-color:var(--ink)}
.icon.mic.live{background:var(--clay);color:#fff;border-color:var(--clay);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(143,86,71,.45)}50%{box-shadow:0 0 0 7px rgba(143,86,71,0)}}
.hint{max-width:var(--w);margin:6px auto 0;font-size:12px;color:var(--dust);text-align:center;min-height:15px}

/* ---------- drawer (profile / support) ---------- */
.veil{position:fixed;inset:0;background:rgba(27,31,26,.45);display:none;z-index:40}
.veil.on{display:block}
.drawer{
  position:fixed;inset-inline-end:0;top:0;bottom:0;width:min(420px,92vw);z-index:41;
  background:var(--stone);border-inline-start:1px solid var(--line);
  transform:translateX(110%);transition:transform .22s ease;display:flex;flex-direction:column
}
html[dir="rtl"] .drawer{transform:translateX(-110%)}
.drawer.on,html[dir="rtl"] .drawer.on{transform:none}
.dhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.dhead h2{font-family:'Frank Ruhl Libre',serif;font-size:18px;font-weight:500;margin-inline-end:auto}
.dbody{overflow-y:auto;padding:16px;flex:1}
.block{margin-bottom:22px}
.block>h3{font-size:13px;font-weight:500;color:var(--dust);margin-bottom:9px}
.entry{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.entry b{display:block;font-weight:500;font-size:15.5px}
.entry q{display:block;color:var(--ink-2);font-size:14px;margin-top:5px;font-style:normal}
.entry q::before{content:"“"}.entry q::after{content:"”"}
.entry.cost{border-inline-start:3px solid var(--clay)}
.entry.strength{border-inline-start:3px solid var(--olive)}
.empty{color:var(--dust);font-size:14px;background:var(--paper-2);border-radius:var(--r);padding:14px}
.sup{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;text-decoration:none;color:inherit}
.sup b{display:block;font-weight:500}
.sup span{color:var(--olive);font-size:15px}
.danger{color:var(--clay);font-size:13.5px;background:var(--clay-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.linkish{color:var(--ink-2);font-size:13.5px;text-decoration:underline;background:none;padding:4px 0}
.lvl{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;margin-top:9px;font-size:12.5px}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--olive)}
.lvln{color:var(--olive);font-weight:500}
.lvld{flex-basis:100%;color:var(--dust)}
.copy{margin-top:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2);background:var(--paper);transition:.15s}
.copy:hover{border-color:var(--ink-2)}
@media (max-width:420px){ .hello{font-size:25px} .turn.them .body{font-size:17.5px} }

body{background:radial-gradient(ellipse at 8% 0%,#E2F1E9,transparent 55%),radial-gradient(ellipse at 100% 35%,#FAEDE1,transparent 55%),var(--stone)}

<body>

<header class="bar">
  <div class="mark" id="mark">Transition Assistant<span id="markSub">a conversation, not a form</span></div>
  <button class="chip" id="btnLang" title="Language">עברית</button>
  <button class="chip" id="btnVoice" title="Read replies aloud">🔊</button>
  <button class="chip" id="btnAI">Ask an AI</button>
  <button class="chip" id="btnVoiceSettings">Voice settings</button>
  <button class="chip badge" id="btnProfile" data-count="0">Profile</button>
  <button class="chip" id="btnHelp">Support</button>
</header>

<!-- ============ WELCOME ============ -->
<main class="screen" id="welcome">
  <div class="pad">
    <section class="mentor-portrait" aria-label="Your Transition Assistant">
      <div class="mentor-face" aria-hidden="true"><img src="./companion-mentor.jpeg" alt="" width="1215" height="1295" fetchpriority="high" decoding="async"></div>
      <div class="mentor-copy"><h2 id="mentorTitle"></h2><p id="mentorText"></p></div>
    </section>
    <div class="welcome-hero">
    <span class="eyebrow" id="wEyebrow"></span>
    <h1 class="hello" id="wTitle"></h1>
    <p class="lede" id="wLede"></p>
    </div>
    <div class="welcome-cards">
    <div class="note"><h3 id="w1t"></h3><p id="w1p"></p></div>
    <div class="note"><h3 id="w2t"></h3><p id="w2p"></p></div>
    <div class="note privacy"><h3 id="w3t"></h3><p id="w3p"></p></div>
    </div>
    <h3 class="mode-title" id="wModeQ"></h3>
    <div class="choices" id="modes">
      <button class="choice on" data-mode="type"><b id="m1"></b><small id="m1s"></small></button>
      <button class="choice" data-mode="voice"><b id="m2"></b><small id="m2s"></small></button>
      <button class="choice" data-mode="both"><b id="m3"></b><small id="m3s"></small></button>
    </div>

      <button id="quickOkay"></button><button id="quickUnsure"></button><button id="quickAsk"></button>

const norm = s => (s||"").replace(/[״“”]/g,'"').replace(/[׳‘’]/g,"'").toLowerCase();

function matchFamilies(text){
  const hits = [];
  FAM_RX.forEach(([n,re],i) => {
    const c = (text.match(re)||[]).length;
    if (c) hits.push({ n, c: Math.min(c,3), i });
  });
  hits.sort((a,b) => b.c-a.c || a.i-b.i);
  return hits.slice(0,2).map(h => REF_FAMS.find(f => f.n === h.n)).filter(Boolean);
}

function refContext(){
  const users = S.messages.filter(m => m.role === "user").map(m => norm(m.text));
  const recent = users.slice(-4);
  const any = re => recent.some(t => re.test(t));
  const all = users.slice(-40).join("\n");
  return {
    fams: matchFamilies(all),
    commander: RX_COMMANDER.test(all),
    cv: any(RX.cv), interview: any(RX.interview), job: any(RX.job), edu: any(RX.edu)
  };
}

/* --------------------------------------------------------------------------
   The guidance the companion follows when it writes things for the person.
   To change how CV help, interview help or direction help behaves, edit here.
   -------------------------------------------------------------------------- */
const DOC_MODE = `DOCUMENT MODE — they are asking for CV material, interview stories, a work direction or a study option. When your reply actually produces that material, the usual length rule (70 to 120 words, no lists) is suspended for that reply: write it out, up to about 300 words, as short lines with "• " bullets, then end with ONE question or ONE next action, and set "document":true. For a CV or interview stories, draft what their own words support and mark missing numbers or details in [brackets] — never invent them — and ask for the most valuable missing detail. For work or study directions, if you still know very little about them, do not list options yet: ask the one question that matters most. Ask which language the CV is for (Hebrew or English) if that is unclear. If they are only mentioning the topic in passing, answer in your normal style.`;

const CV_GUIDE = `CV GUIDE — Build only from what they confirmed or described; never invent numbers, scope or achievements. Ask for safe quantities when missing (people, shifts, cases, reports, systems, courses, assets, projects). Ask the target (kind of job or sector) before finalising; with no target, draft a general version and say so. Formula for every bullet: civilian action verb + what they did + scope or conditions + result or purpose. Avoid: combat jargon; inflated claims; empty adjectives (leader, resilient, hard-working, works under pressure) with no behavior shown; unit prestige as proof; anything classified or identifying (names, places, dates, methods, targets, system specifications). Deliver, concisely: (1) a two or three line summary, (2) three to five evidence bullets, (3) keywords suited to the target, (4) tools, certifications or systems that can safely be named. When explaining a confirmed skill, give three levels: plain strength → civilian competency → evidence statement. Illustrative patterns only — always use THEIR facts. Weak: "Combat commander; strong leadership under pressure." Strong: "Led and supported a team through demanding field assignments, coordinating preparation, task allocation, safety and after-action learning under changing conditions." Weak: "Served in intelligence." Strong: "Analyzed information from multiple sources, identified relevant patterns, and produced concise written and verbal briefings for time-sensitive decisions." Weak: "Responsible for equipment." Strong: "Coordinated equipment readiness and inventory records for a multi-team operation, resolving shortages and maintaining continuity under tight deadlines." Support, technical, care and administrative roles must show their real occupational skills — never present them as lesser, and never as frontline work if they were not.`;

const INTERVIEW_GUIDE = `INTERVIEW STORIES — Structure: situation → responsibility (their own part) → action → result → learning; first person, about 60 to 90 seconds spoken. Useful types: solving a problem; working with a team; taking responsibility; adapting to change; leading or teaching (only if they did); learning from a mistake. Draft from their confirmed evidence. If a part is missing (their own action, the result), ask for that one part rather than filling it in. No operational detail.`;

const DIRECTION_GUIDE = `WORK AND STUDY DIRECTIONS — Offer at most three plausible directions, as possibilities and not prescriptions. For each: the strengths that transfer now (from their confirmed evidence); what is missing (knowledge, credential, portfolio, civilian vocabulary); one low-risk test (a conversation, short course, volunteer task, shadowing, small project, entry role); one next action. Also weigh interests, values, health, education so far, family situation, money needs, location and lifestyle — ask about the ones you do not know. Pattern examples: systems + technical learning + troubleshooting → engineering, IT, operations, technical training; information processing + writing + judgment → research, analysis, policy, consulting, finance; leadership + teaching + care → education, training, HR, coaching, community leadership; planning + execution + logistics → operations, supply chain, project coordination, events, field programs; emotional regulation + rapid prioritising + care → healthcare, emergency response, crisis support; field execution + teamwork + responsibility → operations, site work, logistics, emergency services, security, outdoor programs; observation + concentration + reporting → monitoring, QA, investigations, operations centers, risk or fraud work. Never promise a job or an admission, and do not recommend expensive education on generic salary claims. Deadlines, tuition, benefits and admission rules change: do not quote them from memory — say they must be checked with the official source.`;

const EDU_ADD = ` For study or training, compare the realistic routes — degree, certificate, vocational track, apprenticeship, direct employment — and for each say what they already have, what is missing, and (only where you are sure) time and cost; suggest a low-risk way to test interest before committing.`;

const FAMILY_HEAD = `SERVICE-FAMILY HYPOTHESES — from what they said about their service. A role suggests where skills MAY have developed; it proves none of them, and unit prestige is never evidence. "Strongest" means commonly demanded often; "Also likely" depends on the assignment. When you surface candidates: no more than six at a time, most likely first; invite them to pick the three that feel most true, reject any, and add one you missed. Then test one at a time: a concrete example (nothing classified), their own part, how often, guided or independent or led others, and the result. If their real work fits another family better (a support, technical or administrative role, say), follow their real duties instead.`;

const COMMANDER_OVERLAY = `COMMANDER / INSTRUCTOR OVERLAY — only if their duties show they led or trained people. Also test: Planning (4), Time Management (5), Prioritize (11), Leading Processes (14), Leadership (16), Leading People (18), Teaching Skills (19), Work with Different People (21), Organize & Manage (24), Decision Making (38), Trustworthiness (48), Responsibility (51), Communication (58). For evidence ask about team size, training responsibility, decisions they owned, resources coordinated, feedback given, conflicts managed and outcomes. People without formal command can also show leadership, teaching and initiative — ask, don't assume from rank.`;

const OCCUPATIONAL_NOTE = `Civilian skills most easily understood by employers and schools: responsibility and reliability; team coordination; problem-solving; adaptability; planning and prioritisation; communication; independent work and initiative; technical or systems competence; leadership and teaching (when demonstrated); emotional regulation under ordinary pressure. Turn "resilience", "discipline", "hard work" and "working under pressure" into visible behaviors.`;

/* --------------------------------------------------------------------------
   buildReference(): choose ONLY what this moment needs. Nothing is added to
   ordinary conversation in the opening and foundation stages, so the running
   cost stays what it was. Blocks are listed in priority order; anything that
   would push past CONFIG.REF_BUDGET_CHARS is left out.
   -------------------------------------------------------------------------- */
function buildReference(){
  const out = { text:"", doc:false, labels:[] };
  const c = refContext();
  const wantsDoc = c.cv || c.interview || c.job || c.edu;
  const phaseOK = /^(discovery|direction|open)$/.test(S.phase);
  const blocks = [];
  const add = (label, text) => blocks.push({ label, text });
  const nm = id => "#"+id+" "+skillName(id,"en")+" (Momentum: "+REF_SKILLS[id][0]+")";

  if (wantsDoc) add("document mode", DOC_MODE);
  if (c.cv) add("CV guide", CV_GUIDE);
  if (c.interview) add("interview-story guide", INTERVIEW_GUIDE);
  if (c.job || c.edu) add(c.job ? "work & study guide" : "study guide", DIRECTION_GUIDE + (c.edu ? EDU_ADD : ""));

  const known = S.profile.strengths.filter(s => REF_SKILLS[s.id]).slice(0,6);
  if (wantsDoc && known.length)
    add("meaning of confirmed skills", "WHAT THEIR CONFIRMED SKILLS MEAN IN PRACTICE (use to translate; do not quote):\n" +
        known.map(s => "- "+nm(s.id)+": "+REF_SKILLS[s.id][1]+".").join("\n"));

  if (c.fams.length && (wantsDoc || phaseOK))
    add("service family: " + c.fams.map(f => f.t.split(" — ")[0]).join(" + "),
        FAMILY_HEAD + "\n" + c.fams.map(f => "• "+f.t+"\n"+f.x).join("\n"));

  if (c.commander && (wantsDoc || phaseOK)) add("commander/instructor overlay", COMMANDER_OVERLAY);

  const last = [...S.messages].reverse().find(m => m.role === "assistant");
  const ids = (last && last.surfaced ? last.surfaced : []).map(x => +x.id).filter(id => REF_SKILLS[id]).slice(0,3);
  if (ids.length)
    add("evidence questions: "+ids.join(", "), "EVIDENCE QUESTIONS FOR THE SKILLS BEING TESTED (pick one, in your own words, one at a time):\n" +
        ids.map(id => "- "+nm(id)+" — means: "+REF_SKILLS[id][1]+". Ask: "+REF_SKILLS[id][2]).join("\n"));

  const dk = c.fams[0] && FAM_DQ[c.fams[0].n];
  if (dk && (wantsDoc || phaseOK))
    add("role questions: "+dk, "ROLE-SPECIFIC EVIDENCE QUESTIONS ("+FAM_DQ_TITLE[dk]+"):\n" + REF_DQ[dk].map(q => "- "+q).join("\n"));

  if (wantsDoc)
    add("occupational skills list", "OCCUPATIONAL SKILLS BEYOND THE 63 — name these as well when their duties show them; do not force them into the 63: " + REF_LAYER_B.join("; ") + ".\n" + OCCUPATIONAL_NOTE);

  let used = 0; const kept = [];
  blocks.forEach(b => { if (used + b.text.length <= CONFIG.REF_BUDGET_CHARS){ kept.push(b); used += b.text.length; } });
  if (!kept.length) return out;

  out.text = "REFERENCE — background from the Momentum service-to-skills framework. It describes what roles commonly build and how to translate it into civilian terms. It is never a fact about this person until they confirm it with their own example.\n\n" +
             kept.map(b => b.text).join("\n\n");
  out.labels = kept.map(b => b.label);
  out.doc = kept.some(b => b.label === "document mode");
  return out;
}

/* Copy button for CV / interview drafts */
function copyText(text, btn){
  const done = () => { btn.textContent = L().copied; setTimeout(() => { btn.textContent = L().copy; }, 1400); };
  const fallback = () => {
    const t = document.createElement("textarea"); t.value = text; t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch(e){}
    t.remove(); done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

  if (res.status === 404) { out.textContent = t.diag404 + "\n\n" + CONFIG.API_URL + "\n\n" + t.diagNote; return; }
  if (res.status === 401 || res.status === 403) { out.textContent = t.diag401 + "\n\n" + t.diagNote; return; }
  if (res.status >= 500) { out.textContent = t.diag500 + "\n\n" + t.diagNote; return; }
  if (!res.ok) { out.textContent = "HTTP " + res.status + "\n\n" + t.diagNote; return; }
  let data;
  try { data = await res.json(); } catch(e) { out.textContent = t.diagShape + "\n\n" + t.diagNote; return; }
  const txt = (data && Array.isArray(data.content))
    ? data.content.filter(b=>b.type==="text").map(b=>b.text).join(" ").trim() : null;
  out.textContent = txt
    ? t.diagOK + "\n\n→ " + txt.slice(0,80)
    : t.diagShape + "\n\n" + JSON.stringify(data).slice(0,200) + "\n\n" + t.diagNote;
};

function systemPrompt(ref){

    "\nOPEN QUESTIONS: "+(p.open.join("; ")||"none yet")+
    "\nDIRECTIONS RAISED: "+(p.directions.map(d=>d.title).join("; ")||"none yet")+
    "\nSERVICE ACKNOWLEDGED: "+(S.ack?"yes":"no")+
    "\nSHIFT NAMED: "+(S.shift?"yes":"no");

  return `You are a practical transition companion for Israelis finishing IDF service (conscripts, officers, reservists). Reply in ${S.lang==="he"?"Hebrew":"English"}. Your relational stance is an older-brother / experienced-peer presence: adult-to-adult, warm, grounded, practical, loyal, and genuinely caring. Never sound like a parent, teacher, commander, counselor, therapist, bureaucrat, or authority figure. Do not lecture, preach, scold, patronize, or interrogate. Listen first; help the soldier think; give practical help and candid judgment when useful; respect that the soldier makes the decisions. You may be informal and lightly humorous when it fits. Do not claim that you personally served or personally went through military service. When experience is useful, say things like "many soldiers..." or "one thing others have found useful..." rather than inventing your own history.

SELECTED TOPIC: ${S.activeTopic || "general conversation"}
When a topic is selected, answer that topic directly. Do not repeat the welcome, thank-you paragraph, emotional transition preamble, or restart general intake. Use facts already shared; ask only for missing relevant details. For skills, list confirmed skills with evidence, elicit service type, actual role and rank if missing, then suggest potential skills from service experience and test them with examples. Never treat unit or rank as proof. Lists are appropriate for skills and practical output. Act as a practical assistant, not a therapist.

HOW YOU TALK
- Sound like someone in their corner, not someone above them. Use the feel of an older brother who cares enough to listen, be straight with them, and help without taking over. Offer choices and recommendations as help, not orders.
- Give a real answer, not a quick prompt. Write two short paragraphs, roughly 70 to 120 words in total. First paragraph: 2 to 4 sentences of substance that ADD something the person did not say — why this matters, what is common at this stage, what trade-off or pattern is in play, or the reasoning behind where you are heading. Second paragraph: ONE question that follows from it. Never a list of questions. Use bullet points when listing skills or producing practical output.
- Never open by restating, summarising or quoting what they just said. Do not use "I hear", "I heard", "what I'm hearing", "it sounds like", "so you're saying", "you mentioned", or their own phrases echoed back. Start with the substance: your read, the explanation, or the answer. They know what they said.
- Don't hand out empty praise ("amazing", "incredible", "you're a natural") that isn't backed by something they actually showed you — it isn't worth anything to them if it isn't earned. But once it IS earned by their own evidence, say so warmly and specifically, don't just note it clinically.
- Never assume. Role, unit, or rank is a HYPOTHESIS, never a conclusion. Two people in the same role built different things.
- Do not offer a menu of services or modules. What is needed emerges from what they say.
- If they are vague about an event or a fact, ask for one concrete moment: what happened, what did you actually do, what did it cost.
- If they are vague about a feeling — "I don't know", "what do you think", "it's hard to explain" — you may venture ONE plain-spoken guess at what's underneath, built from what they've actually told you so far, not a generic guess. State it clearly as a guess, not a fact ("maybe it's more X than Y" — never "you feel X"), and ask if that's close. If they correct it, drop your guess immediately and go with theirs — do not defend it or re-argue it.

RESPOND TO WHAT THEY SAID BY BUILDING ON IT, NOT REPEATING IT
Every reply must engage the specific content of their last message — but by adding to it, never by echoing it. If they said "excited but uncertain", "I just want to be free", or "strange", do not hand those words back. Explain what is usually going on underneath that state, and connect it to the specifics they gave. Never ask a generic next question that would make sense regardless of what they just told you; that is the single worst failure mode of this app.
When they express uncertainty, restlessness, wanting freedom, numbness, or not knowing what to do, treat that as the subject, not as an obstacle to getting through your questions. Explain plainly what is common for people leaving service — the sudden absence of structure, the gap between relief and emptiness, friends scattering, money pressure, family not understanding — say why it happens, and connect it to what THEY specifically said. Keep it a short, grounded explanation, not a lecture, then one question that follows from it.

PHASES (move when the person is ready, not on a timer)
1 opening — establish, early and explicitly: where they served, their ACTUAL ROLE and rank (combat, commander, officer, support, technical), how long, and where they are now. Then how it is actually sitting with them and what is on their mind. Get role early — you need it as a hypothesis — but never treat it as the conclusion about what they built.
2 foundation — the transition foundation conversation: what their service actually required of them; what it took from them; what it required them to become; how it changed what they can do, what they trust themselves with, what responsibility means to them, and how they see the world. Hold both sides: service is sacrifice AND it built things. Do not resolve that tension prematurely.
3 discovery — surface possible strengths from what they described, then TEST each one by asking for a concrete example. A strength enters the profile only with the person's own evidence.
4 direction — what they are weighing next: work, study, money, relationships, rest, meaning.
5 open — ongoing. Keep analysing, keep following up on what was decided.

ACKNOWLEDGE ONCE, GROUNDED IN THEIR OWN WORDS
If SERVICE ACKNOWLEDGED is "no" and they have just told you something concrete about their service — what unit, how long, how intense — acknowledge in one sincere sentence what carrying that much, for that long, weighs — without listing their details back to them and without a generic compliment about their unit or character. Do NOT repeat the welcome framing (gratitude, "I am here for you", human support) — the opening message already said all of it, and repeating it sounds scripted. Acknowledge the weight briefly, then continue with real substance. Set "ack":true on this reply. Do this once only; after that do not repeat it, and never let it become praise of their capability — that still needs their own evidence to earn a place in the profile.

NAME THE SHIFT, WHEN IT'S ACTUALLY HAPPENING
If SHIFT NAMED is "no" and they ask you to decide for them, or say they don't know what to do with no one left to ask — that is usually the real thing in the room: in service most decisions this size were made above them, and right now nobody is deciding this one but them. Say so plainly in one sentence — this not-knowing is the first rep of deciding for yourself, not a delay before the real thing starts — then hand the decision straight back with a real question. Set "shift":true on this reply. Only when the pattern is actually present, not as a stock line, and only once. Do NOT fire this when they've also named concrete constraints (money, housing, health, family) in the same message — naming real constraints and asking for input is ordinary problem-solving, not the orders-dependence pattern; just answer the actual question with real alternatives instead.

STRENGTH FRAMEWORK (discovery aid, never a checklist, never shown as a list to tick)
${names}

LEVELS — when you confirm a strength, also set its level from THEIR example: 1 exposed (some experience, close guidance), 2 practiced (used it repeatedly), 3 proficient (trusted to do it independently in demanding situations), 4 led or taught (guided others, set standards, or improved how the work was done). Judge from frequency, autonomy, complexity, scope and result; say briefly why you chose it and drop it if they correct you. Rank and unit prestige never raise a level.

REFERENCE — a REFERENCE section may appear near the end of these instructions. Use it to ask sharper evidence questions and to write CV, interview, work and study material.

BEHAVIOUR THAT NEVER STOPS, in every phase including long after orientation:
Understand before answering. Analyse, don't just reflect back. When they raise a choice, generate at least two real alternatives they did not mention, state the trade-offs honestly including cost and time, and give a recommendation when you have enough to justify one — say what would change your mind. Be honest even when it's not what they want to hear — don't just agree to be agreeable — but say it gently, the way someone who's on their side would, not as a correction. Follow up on things they said they would do.

BOUNDARIES
You are not a clinician. If there is real distress — hopelessness, not sleeping, not functioning, thoughts of hurting themselves — set concern:true, say plainly that talking to a person would help, and keep talking with them. Never replace a professional, never diagnose.

OUTPUT — reply with JSON only, no markdown fences:
{"reply":"your words","phase":"opening|foundation|discovery|direction|open","candidates":[{"id":17,"why":"one line, in the reply language"}],"confirmed":[{"id":17,"level":2,"evidence":"their own concrete example, 10 words max, their language"}],"costs":["something the service took, in their words"],"open":["something unresolved worth returning to"],"proposals":[{"title":"short action they could take next","why":"one line"}],"concern":false,"ack":false,"shift":false,"document":false}
Include only the fields that apply. candidates only when you are about to test them. confirmed only with real evidence they gave. proposals only when a direction genuinely emerged — never as an opening menu. ack:true and shift:true only on the one turn each is described above. level only with confirmed. document:true only when the reply is CV material, interview stories, or a work or study comparison written out in full.

${ref.text ? ref.text + "\n\n" : ""}CURRENT STATE
${state}`;
}

async function askModel(){
  const hist = S.messages
    .filter(m => m.role === "user" || m.role === "assistant")
    .slice(-CONFIG.HISTORY_TURNS)
    .map(m => ({ role: m.role, content: m.text }));

  const ref = buildReference();
  const sys = systemPrompt(ref);
  DIAG.source = "live API";
  DIAG.refs = ref.labels; DIAG.refChars = ref.text.length;
  DIAG.sentTurns = hist.length;
  DIAG.sysChars = sys.length;
  DIAG.estPromptTokens = Math.round((sys.length + hist.reduce((a,m)=>a+m.content.length,0)) / 4);
  DIAG.at = new Date().toLocaleTimeString();

  const res = await fetch(CONFIG.API_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      model: CONFIG.MODEL,
      max_tokens: ref.doc ? CONFIG.MAX_TOKENS_DOCUMENT : CONFIG.MAX_TOKENS,
      system: sys,
      messages: hist
    })
  });
  if (!res.ok) { DIAG.error = "HTTP "+res.status; throw new Error("HTTP "+res.status); }
  const data = await res.json();
  if (data.usage) DIAG.usage = data.usage;
  const raw = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  DIAG.raw = raw;
  const parsed = parseReply(raw);
  DIAG.parsedOK = !!(parsed && parsed.reply && raw.indexOf("{") > -1);
  DIAG.parsed = parsed;
  return parsed;
}

/* Live diagnostics — what the last turn actually did. Not persisted. */
const DIAG = { source:"—", raw:"", parsed:null, parsedOK:null, sentTurns:0, sysChars:0, estPromptTokens:0, usage:null, error:null, at:"—", triggers:[], refs:[], refChars:0 };

/* A raw line break inside a JSON string is invalid JSON. Long replies such as
   CV drafts sometimes arrive that way, so put the break back as \n. */
function fixBreaksInStrings(t){
  let out = "", inStr = false, esc = false;
  for (const ch of t){
    if (inStr){
      if (esc){ esc = false; out += ch; continue; }
      if (ch === "\\"){ esc = true; out += ch; continue; }
      if (ch === '"'){ inStr = false; out += ch; continue; }
      if (ch === "\n"){ out += "\\n"; continue; }
      if (ch === "\r"){ continue; }
      if (ch === "\t"){ out += "\\t"; continue; }
      out += ch;
    } else { if (ch === '"') inStr = true; out += ch; }
  }
  return out;
}
function parseReply(raw){
  let txt = raw.replace(/```json|```/g,"").trim();
  const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
  if (a > -1 && b > a) {
    const body = txt.slice(a,b+1);
    try { return JSON.parse(body); } catch(e){}
    try { return JSON.parse(fixBreaksInStrings(body)); } catch(e){}
    const m = body.match(/"reply"\s*:\s*"([\s\S]*?)"\s*(?:,\s*"(?:phase|candidates|confirmed|costs|open|proposals|concern|ack|shift|document)"|\}\s*$)/);
    if (m) return { reply: m[1].replace(/\\n/g,"\n").replace(/\\"/g,'"').replace(/\\\\/g,"\\") };
  }
  return { reply: txt || "…" };   // fall back to plain text, never break the conversation
}

    out.confirmed = [{ id: 26, evidence: userText.trim().slice(0,40) }];
  }
  if (S.practiceStep >= 5){
    out.proposals = S.lang==="he"
      ? [{title:"לפרק את הצעד הראשון",why:"מה בדיוק צריך לקרות השבוע"},{title:"לבדוק שתי אפשרויות במקביל",why:"לא להתחייב לאחת מוקדם מדי"}]
      : [{title:"Break down the first step",why:"What exactly has to happen this week"},{title:"Test two options side by side",why:"Don't commit to one too early"}];
    out.phase = "direction";
  }
  S.practiceStep++;
  return out;
}

function openingText(lang){
  return lang === "he"
    ? "קודם כול — תודה. כמה זמן ששירתת, נתת חלק מהחיים שלך למדינה הזאת, וזה חשוב.\n\nתחשוב עליי פחות כמו מורה, מפקד או יועץ, ויותר כמו אח גדול שנמצא בצד שלך — בגובה העיניים, מעשי, ישר איתך, לא שופט, ונמצא כאן כי חשוב איך ייראה הצעד הבא שלך. אני לא אגיד לך מה אתה אמור להרגיש או מה אתה חייב לעשות. אפשר לחשוב יחד, להשוות אפשרויות אמיתיות, ולהפוך את מה שעומד מולך לצעד הבא שאפשר להתמודד איתו.\n\nאיך אתה עכשיו, ומה הדבר שהכי יעזור לך שניגש אליו קודם?"
    : "First — thank you. However long you served, you gave part of your life to this country, and that matters.\n\nThink of me less like a teacher, commander, or counselor and more like an older brother in your corner — practical, straight with you, not judging you, and here because your next step matters. I won't tell you what you're supposed to feel or what you have to do. We can think things through, compare real options, and turn whatever is in front of you into a manageable next step.\n\nHow are you doing right now, and what would be most useful to help with first?";
}
function messageText(m){
  // Recognize openings saved by earlier versions as well as new ones.
  if (m.kind === "opening" || (m.role === "assistant" &&
      (m.text === openingText("he") || m.text === openingText("en")))) return openingText(S.lang);
  return m.text;
}
function openConversation(){
  if(S.messages.some(m=>m.kind==="opening") || S.activeTopic) return;
  pushMsg("assistant", openingText(S.lang), {kind:"opening"});
}

async function sendUser(text){
  text = (text||"").trim();
  if (!text) return;
  $("input").value = ""; $("input").style.height="auto";
  stopSpeaking();
  pushMsg("user", text);
  showThinking();

  let out;
  try {
    if (S.practice) throw new Error("practice");
    out = await askModel();
  } catch (err) {
    if (!CONFIG.ALLOW_PRACTICE_FALLBACK) { hideThinking(); pushMsg("system", L().sendFail); return; }
    if (!S.practice) { S.practice = true; pushMsg("system", L().offline); }
    out = practiceReply(text);
    DIAG.source = "Practice Mode (built-in script)";
    DIAG.raw = "(no API call — scripted reply)";
    DIAG.parsed = out; DIAG.parsedOK = null; DIAG.usage = null;
    DIAG.sentTurns = 0; DIAG.sysChars = 0; DIAG.estPromptTokens = 0;
    DIAG.refs = []; DIAG.refChars = 0;
    DIAG.at = new Date().toLocaleTimeString();
  }
  hideThinking();
  applyReply(out);
}

function applyReply(out){
  DIAG.triggers = [];
  if (out.ack) DIAG.triggers.push("service acknowledgment (once)");
  if (out.shift) DIAG.triggers.push("named the shift to self-direction (once)");
  if (out.candidates && out.candidates.length) DIAG.triggers.push("surfaced "+out.candidates.length+" candidate skill(s) to test");
  if (out.confirmed && out.confirmed.length) DIAG.triggers.push("confirmed "+out.confirmed.length+" strength(s) with evidence");
  if (out.proposals && out.proposals.length) DIAG.triggers.push("offered "+out.proposals.length+" direction(s)");
  if (out.document) DIAG.triggers.push("wrote CV / interview / direction material");
  if (out.concern) DIAG.triggers.push("flagged concern → support surfaced");
  if (!DIAG.triggers.length) DIAG.triggers.push("plain conversational turn, no rules fired");

  if (out.phase) S.phase = out.phase;
  if (out.ack) S.ack = true;
  if (out.shift) S.shift = true;

  // profile updates — confirmed strengths need evidence, that is the whole point
  (out.confirmed||[]).forEach(c => {
    if (!c || !c.id) return;
    const lv = (+c.level >= 1 && +c.level <= 4) ? Math.round(+c.level) : 0;
    const have = S.profile.strengths.find(x => x.id === +c.id);
    if (!have) S.profile.strengths.push({ id:+c.id, evidence: c.evidence || "", level: lv || undefined });
    else if (lv) have.level = lv;
  });
  (out.costs||[]).forEach(c => { if (c && !S.profile.costs.includes(c)) S.profile.costs.push(c); });
  (out.open||[]).forEach(o => { if (o && !S.profile.open.includes(o)) S.profile.open.push(o); });
  (out.proposals||[]).forEach(p => {
    if (p && p.title && !S.profile.directions.some(d=>d.title===p.title)) S.profile.directions.push(p);
  });

  pushMsg("assistant", out.reply || "…", {
    surfaced: (out.candidates||[]).filter(c=>c && c.id),
    props: out.proposals || [],
    doc: !!out.document
  });

  $("btnProfile").dataset.count = S.profile.strengths.length;
  if (out.concern) offerSupport();
  save();
}

  openSupport();

let rec = null, listening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

$("btnMic").onclick = () => listening ? stopListening() : startListening();

function voiceStatus(en, he){ $("hint").textContent = S.lang === "he" ? he : en; }
function startListening(){
  if (!SR) { $("hint").textContent = L().micNo; return; }
  if (!window.isSecureContext) { voiceStatus("Open the HTTPS app link to use the microphone.", "פתח את הקישור המאובטח לאפליקציה כדי להשתמש במיקרופון."); return; }
  stopSpeaking();
  let failed = false, finalText = "", interim = "";
  const original = $("input").value;
  const reset = () => { listening = false; $("btnMic").classList.remove("live"); };
  try {
    rec = new SR(); rec.lang = S.lang === "he" ? "he-IL" : "en-US";
    rec.interimResults = true; rec.continuous = false;
    rec.onresult = e => {
      interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + " ";
        else interim += e.results[i][0].transcript;
      }
      $("input").value = (original + " " + finalText + interim).trim();
    };
    rec.onerror = e => {
      failed = true; reset();
      if (e.error === "not-allowed" || e.error === "service-not-allowed") voiceStatus("Microphone permission was denied. Allow microphone access in this site's browser settings, then retry.", "הגישה למיקרופון נדחתה. אפשר גישה בהגדרות האתר בדפדפן ונסה שוב.");
      else if (e.error === "audio-capture") voiceStatus("No microphone is available. Check your device microphone.", "אין מיקרופון זמין. בדוק את המיקרופון במכשיר.");
      else if (e.error === "network") voiceStatus("Speech recognition could not connect. Check your internet connection or use keyboard dictation.", "זיהוי הדיבור לא הצליח להתחבר. בדוק את האינטרנט או השתמש בהכתבה במקלדת.");
      else voiceStatus("No speech was recognized. Retry or use keyboard dictation.", "לא זוהה דיבור. נסה שוב או השתמש בהכתבה במקלדת.");
    };
    rec.onend = () => {
      reset(); if (failed) return;
      if ((finalText + interim).trim()) { $("hint").textContent = ""; sendUser($("input").value); }
      else voiceStatus("No speech was recognized. Tap the microphone to retry.", "לא זוהה דיבור. לחץ על המיקרופון כדי לנסות שוב.");
    };
    listening = true; $("btnMic").classList.add("live"); $("hint").textContent = L().micOn;
    rec.start();
  } catch (err) { failed = true; reset(); voiceStatus("Could not start the microphone. Retry in Chrome or use keyboard dictation.", "לא ניתן להפעיל את המיקרופון. נסה בכרום או השתמש בהכתבה במקלדת."); }
}
function stopListening(){ if (rec) { try{ rec.stop(); }catch(e){} } listening=false; $("btnMic").classList.remove("live"); }

let voicesReady = false;
if (window.speechSynthesis) window.speechSynthesis.getVoices();

/* No gender field exists on Web Speech API voices, so this matches
   against common female voice names across Windows, macOS, iOS,
   Android and Google Chrome OS/Hebrew voice packs. Falls back to the
   first voice for the language if nothing matches, so it never picks
   a wrong-language voice just to satisfy the female preference. */
const FEMALE_VOICE_RX = /female|zira|hazel|susan|eva|aria|jenny|sonia|libby|maisie|samantha|victoria|karen|moira|tessa|fiona|ava|serena|salli|joanna|kimberly|kendra|ivy|amy|emma|amelia|catherine|olivia|nicky|carmit|היל[ה]|נעמ[הי]|שיר[ה]|רות|מיה|תמר|כרמית/i;
function pickDefaultVoice(wantLangPrefix){
  const voices = window.speechSynthesis.getVoices();
  const matching = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(wantLangPrefix));
  const pool = matching;
  return pool.find(v => FEMALE_VOICE_RX.test(v.name)) || pool[0] || null;
}

function speak(text){
  if (!window.speechSynthesis) { voiceStatus("Read-aloud is unavailable in this browser.", "הקראה אינה זמינה בדפדפן הזה."); return; }
  stopSpeaking();
  const u = new SpeechSynthesisUtterance(text.replace(/\n+/g,". "));
  u.lang = S.lang === "he" ? "he-IL" : "en-US";
  u.rate = S.rate || 0.98;
  u.pitch = S.pitch != null ? S.pitch : 1;
  if (S.voiceURI){
    const v = window.speechSynthesis.getVoices().find(x => x.voiceURI === S.voiceURI);
    if (v && v.lang.toLowerCase().startsWith(S.lang)) u.voice = v;
  } else {
    const v = pickDefaultVoice(S.lang === "he" ? "he" : "en");
    if (v && v.lang.toLowerCase().startsWith(S.lang)) u.voice = v;
  }
  /* Chrome/Chromium bug workarounds, both silent (no error thrown):
     1) the very first utterance after the page loads can be dropped
        entirely if the browser's voice list hasn't finished loading yet;
     2) any utterance longer than ~15s gets cut off mid-sentence unless
        kept alive with a periodic pause/resume "heartbeat". */
  let heartbeat = null;
  const clearHeartbeat = () => { if (heartbeat){ clearInterval(heartbeat); heartbeat = null; } };
  u.onstart = () => {
    clearHeartbeat();
    heartbeat = setInterval(() => {
      if (!window.speechSynthesis.speaking) return;
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    }, 5000);
  };
  u.onend = clearHeartbeat;
  u.onerror = e => { clearHeartbeat(); if (e.error !== "canceled" && e.error !== "interrupted") voiceStatus("Read-aloud failed. Open Voice settings to choose a voice; check device text-to-speech settings.", "ההקראה נכשלה. בחר קול בהגדרות הקול ובדוק את הגדרות הטקסט לדיבור במכשיר."); };
  const doSpeak = () => window.speechSynthesis.speak(u);
  if (!voicesReady && window.speechSynthesis.getVoices().length === 0){
    setTimeout(doSpeak, 150);
  } else {
    doSpeak();
  }
}

if (S.started){ enterChat(); if(!S.messages.length) openConversation(); }
</script>

<script>
/* Topics use the existing conversation and never send a request without Send. */
const TRANSITION_TOPICS = [
 ["cv","CV","קורות חיים","Help me write or improve my CV.","עזור לי לכתוב או לשפר את קורות החיים שלי."],
 ["applications","Job applications","מועמדות לעבודה","Help me prepare a job application.","עזור לי להכין מועמדות לעבודה."],
 ["career","Work and career","עבודה וקריירה","Help me explore work and career options that fit my experience and goals.","עזור לי לבדוק אפשרויות עבודה וקריירה שמתאימות לניסיון ולמטרות שלי."],
 ["skills","My Skills","הכישורים שלי","Help me identify and refine my skills using real examples from my service and civilian life. Treat skills inferred from my unit, role or rank as suggestions until I confirm them. Ask one question at a time.","עזור לי לזהות ולדייק את הכישורים שלי באמצעות דוגמאות אמיתיות מהשירות ומהחיים האזרחיים. הצג כישורים המוסקים מהיחידה, התפקיד או הדרגה כהצעות עד שאאשר אותם. שאל שאלה אחת בכל פעם."],
 ["study","Studies","לימודים","Help me plan my studies and next steps.","עזור לי לתכנן את הלימודים ואת הצעדים הבאים."],
 ["rights","Rights and benefits","זכויות והטבות","Help me explore rights and benefits relevant to me. Verify current details with official sources before presenting eligibility as a fact.","עזור לי לבדוק זכויות והטבות רלוונטיות. יש לאמת פרטים עדכניים במקורות רשמיים לפני קביעה שאני זכאי."],
 ["money","Money","כסף","Help me think through my budget and financial next steps.","עזור לי לחשוב על התקציב ועל הצעדים הכלכליים הבאים."],
 ["travel","Travel","נסיעות וטיולים","Help me plan travel alongside my other plans.","עזור לי לתכנן טיול לצד התוכניות האחרות שלי."],
 ["family","Relationships and family","מערכות יחסים ומשפחה","Help me think through relationships and family during my transition.","עזור לי לחשוב על מערכות יחסים ומשפחה בתקופת המעבר."],
 ["support","Emotional support","תמיכה רגשית","I would like support with how I am feeling during my transition.","אני רוצה תמיכה במה שאני מרגיש בתקופת המעבר."]
];
function paintTopicPanel(){
 const he=S.lang==="he";
 $("topicTitle").textContent=he?"במה תרצה עזרה?":"What would you like help with?";
 $("topicHint").textContent=he?"בחר נושא. העוזר מגיב לנושא שבחרת.":"Choose a topic. The assistant responds to the topic you choose.";
 $("topicButtons").setAttribute("aria-label",he?"נושאים למעבר":"Transition topics");
 $("topicButtons").replaceChildren();
 TRANSITION_TOPICS.forEach(topic=>{
  const b=el("button",null,topic[he?2:1]); b.type="button"; b.dataset.topic=topic[0]; b.setAttribute("aria-pressed",String(S.activeTopic===topic[0]));
  b.onclick=()=>topic[0]==="skills"?openMySkills():prepareTopic(topic);
  $("topicButtons").appendChild(b);
 });
}

const TOPIC_RESPONSES={"cv":["A useful CV connects your actual responsibilities and achievements to the work you want. I can build a first draft with your service experience, education and confirmed skills.\n\nWhat kind of job is this CV for?","קורות חיים טובים מחברים את האחריות וההישגים שלך לעבודה שאתה רוצה. אוכל להכין טיוטה עם הניסיון מהשירות, ההשכלה והכישורים שאושרו.\n\nלאיזה סוג עבודה מיועדים קורות החיים?"],"applications":["I can help tailor an application to a specific job, including a cover letter and examples that match the requirements.\n\nCan you paste the job description or tell me which position you want?","אוכל לעזור להתאים מועמדות למשרה מסוימת, כולל מכתב פנייה ודוגמאות שמתאימות לדרישות.\n\nתוכל להדביק את תיאור המשרה או לומר לאיזה תפקיד אתה רוצה להגיש מועמדות?"],"career":["We can compare work options against your interests, experience, skills and practical needs, then choose a manageable first step.\n\nWhat kind of work interests you, even if you are still unsure?","נוכל להשוות אפשרויות עבודה לפי תחומי העניין, הניסיון, הכישורים והצרכים המעשיים שלך, ואז לבחור צעד ראשון.\n\nאיזה סוג עבודה מעניין אותך, גם אם אתה עדיין לא בטוח?"],"study":["I can help compare study routes and work backwards from your intended start date, including admission, preparation, time and costs.\n\nWhat would you like to study, or which fields are you considering?","אוכל לעזור להשוות מסלולי לימודים ולתכנן לאחור ממועד ההתחלה, כולל קבלה, הכנה, זמן ועלויות.\n\nמה תרצה ללמוד, או אילו תחומים אתה שוקל?"],"rights":["We can identify benefits to check and the documents you may need. Eligibility and deadlines must be verified with the responsible official service.\n\nAre you finishing regular service, serving in the reserves, or already discharged?","נוכל לזהות זכויות שכדאי לבדוק ומסמכים שייתכן שתצטרך. יש לאמת זכאות ומועדים מול הגוף הרשמי האחראי.\n\nאתה מסיים שירות סדיר, משרת במילואים או כבר השתחררת?"],"money":["We can make a practical budget around income, essential expenses and your next plans, then identify the first change that would help.\n\nWhat is the main money issue you want to work on?","נוכל לבנות תקציב מעשי לפי ההכנסה, ההוצאות החיוניות והתוכניות הבאות שלך, ולזהות שינוי ראשון שיעזור.\n\nמה הנושא הכלכלי העיקרי שתרצה לעבוד עליו?"],"travel":["I can help fit a trip around your budget, work or studies and important dates.\n\nWhere would you like to go, and roughly when?","אוכל לעזור להתאים טיול לתקציב, לעבודה או ללימודים ולמועדים חשובים.\n\nלאן תרצה לנסוע ובערך מתי?"],"family":["We can work on a particular conversation, changing expectations, or reconnecting with people close to you.\n\nWhich relationship or family situation would you like help with?","נוכל לעבוד על שיחה מסוימת, שינוי בציפיות או חידוש הקשר עם אנשים קרובים.\n\nבאיזה קשר או מצב משפחתי תרצה עזרה?"],"support":["You can describe what is happening at your own pace. I can help you sort through it and consider a next step; human support is also available through the Support button.\n\nWhat is weighing on you most right now?","אפשר לתאר את מה שקורה בקצב שלך. אוכל לעזור לעשות סדר ולחשוב על צעד הבא; תמיכה אנושית זמינה גם דרך כפתור התמיכה.\n\nמה הכי מכביד עליך עכשיו?"]};
function skillsTopicText(){
 const he=S.lang==="he", strengths=(S.profile.strengths||[]).filter(s=>SKILLS.some(row=>+row[0]===+s.id));
 const list=strengths.map(s=>{
  const row=SKILLS.find(row=>+row[0]===+s.id);
  return "• "+row[he?3:2]+(s.evidence?" — "+s.evidence:"");
 }).join("\n");
 if(list)return (he?"הכישורים שאושרו עד עכשיו:\n":"Your confirmed skills so far:\n")+list+"\n\n"+(he?"איזה כישור תרצה להוסיף או לדייק באמצעות דוגמה מהשירות או מהחיים האזרחיים?":"Which skill would you like to add or refine using an example from your service or civilian life?");
 return he
  ?"עדיין לא זוהו כישורים אישיים בשיחה שלך. נוכל לבדוק כישורים כמו עבודת צוות, פתרון בעיות או מנהיגות לפי הניסיון שלך — אלה דוגמאות לבדיקה, לא קביעה שיש לך אותם.\n\nבאיזה סוג שירות שירתת, ומה היו התפקיד והדרגה שלך? אפשר לציין יחידה באופן כללי, בלי פרטים מסווגים."
  :"No personal skills have been identified in your conversation yet. We can explore skills such as teamwork, problem-solving or leadership based on your experience — these are examples to check, not claims about your skills.\n\nWhat kind of service did you do, and what were your role and rank? You can name the unit generally, without classified details.";
}
function prepareTopic(topic){
 if($("thinking"))return;
 closeDrawer(); stopSpeaking();
 S.started=true; S.activeTopic=topic[0]; S.ack=true;
 enterChat(); paintTopicPanel();
 const reply=topic[0]==="skills"?skillsTopicText():TOPIC_RESPONSES[topic[0]][S.lang==="he"?1:0];
 pushMsg("assistant",reply,{kind:"topic",topic:topic[0]});
 if(window.matchMedia("(max-width:1099px)").matches)$("topicPanel").open=false;
 $("input").focus();
}
function openMySkills(){prepareTopic(TRANSITION_TOPICS.find(t=>t[0]==="skills"));}
function topicPracticeReply(userText){
 const he=S.lang==="he", id=S.activeTopic;
 if(id==="skills"){
  const ids=[]; HINTS.forEach(([re,list])=>{if(re.test(userText))list.forEach(x=>ids.push(x));});
  const candidates=[...new Set(ids)].slice(0,6).map(id=>({id}));
  return {reply: candidates.length
   ? (he?"לפי תיאור השירות שלך, אלה כישורים אפשריים שכדאי לבדוק. הם עדיין אינם כישורים מאושרים שלך.\n\nבאיזה מהם השתמשת בפועל? תן דוגמה אחת למה שעשית.":"Based on your service description, these are possible skills to explore. They are not yet confirmed as your skills.\n\nWhich did you actually use? Give one example of what you did.")
   : (he?"כדי לזהות כישור אישי צריך דוגמה, ולא רק שם תפקיד. כשהשירות המקוון אינו זמין, איני יכול לנתח או לאשר אוטומטית את הדוגמה שלך.\n\nתוכל לתאר משימה אחת שביצעת ואיך התמודדת איתה?":"Identifying a personal skill takes an example, not just a role title. With the online service unavailable, I cannot automatically analyse or confirm your example.\n\nCan you describe one task you carried out and how you handled it?"),
   candidates};
 }
 const labels=TRANSITION_TOPICS.find(t=>t[0]===id);
 return {reply:he
  ?"שמרתי את הפרטים שלך בנושא "+labels[2]+". שירות ה-AI אינו זמין כרגע, ולכן איני יכול להכין תשובה מותאמת לפרטים החדשים. אפשר לנסות שוב מאוחר יותר או להשתמש בכפתור ׳שאל AI׳.\n\n"+TOPIC_RESPONSES[id][1]
  :"Your details for "+labels[1]+" are saved. The AI service is currently unavailable, so I cannot tailor a response to the new details. You can try again later or use Ask an AI.\n\n"+TOPIC_RESPONSES[id][0]};
}

const topicBreakpoint=window.matchMedia("(min-width:1100px)");
function sizeTopicPanel(){ $("topicPanel").open=topicBreakpoint.matches; }
topicBreakpoint.addEventListener("change",sizeTopicPanel);
sizeTopicPanel(); paintTopicPanel();
</script>

</body>
</html>
